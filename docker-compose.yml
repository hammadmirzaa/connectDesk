version: '3.8'

services:
  # ----------------------------------------
  # 1. React Frontend Service
  # ----------------------------------------
  frontend:
    # Tells Docker to build the image using the Dockerfile inside the /frontend folder
    build: ./frontend
    
    # Maps port 3000 on your local machine to port 3000 inside the container
    ports:
      - "3000:3000"
      
    # Volumes allow you to see code changes instantly without having to rebuild the container
    volumes:
      - ./frontend:/app
      # This prevents your local node_modules from overriding the container's node_modules
      - /app/node_modules

  # ----------------------------------------
  # 2. Django Backend Service
  # ----------------------------------------
  backend:
    # Tells Docker to build the image using the Dockerfile inside the /backend folder
    build: ./backend
    
    # Maps port 8000 on your local machine to port 8000 inside the container
    ports:
      - "8000:8000"
      
    # Volumes allow you to see code changes instantly without having to rebuild the container
    volumes:
      - ./backend:/app
